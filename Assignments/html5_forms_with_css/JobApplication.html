<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application</title>

    <style>
        label{
            display: inline-block;
            width: 85px;
        }
        label{
            margin: 5px;
            padding: 5px;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="file"] {
            padding: 5px;
            border-radius: 5px;
        }
    </style>

</head>
<body>
    <form id="jobApplication">

        <h1 style="text-align: center;">Job Application</h1>

        <label for="fullName">Full Name :</label>
        <input type="text" name="fullName" id="fullName"  style="border:1px solid black; margin:5px; " required><br>

        <label for="email">Email :</label>
        <input type="email" name="email" id="email" style="border:1px solid black; margin:5px;" required><br>
    
        <label for="phone">Phone :</label>
        <input type="tel" name="phone" id="phone" style="border:1px solid black; margin:5px;" required><br>

        <label for="resume">Resume :</label>
        <input type="file" name="resume" id="resume" style="border:1px solid black; margin:5px;" required><br>
       
        <button type="submit" id="submit-btn" name="submit-btn" style="background:green; color:white;">Submit</button>
        <button type="reset" id="reset-btn" name="reset-btn">Reset</button>

    </form>

</body>
</html>
