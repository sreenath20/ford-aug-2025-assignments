<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E Commerce Checkout</title>

    <style>
        body{
            display: flex;
            justify-content: center;
        }
        #eCommerceCheckout {
            margin: 5% 0 0 0; 
            width: 500px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        #eCommerceCheckout h1 {
            text-align: center;
        }

        #eCommerceCheckout label {
            display: inline-block;
            width: 130px;
            margin: 5px;
            padding: 5px;
        }

        #eCommerceCheckout input[type="date"],
        #eCommerceCheckout input[type="range"],
        #eCommerceCheckout select {
            width: 200px;
            margin: 5px;
            padding: 5px;
        }

        #eCommerceCheckout button{
            margin :10px 0 0 20%;
            padding: 10px 5px;
            width: 100px;
            border: 0.8px solid #ccc;
            border-radius: 5px;
        }

        #eCommerceCheckout button[type="submit"] {
            background-color: #63de67;
            color: white;
            cursor: pointer;
        }

        #eCommerceCheckout button[type="submit"]:hover {
            background-color: #23f02a;
        }

        #eCommerceCheckout button[type="reset"]:hover {
            background-color: #ff0000;
        }

        #eCommerceCheckout button[type="reset"] {
            background-color: #e64242;
            color: white;
            cursor: pointer;
        }


    </style>
    
</head>
<body>
    <form id="eCommerceCheckout">
        <h1>
            E Commerce Checkout
        </h1>

  
            <label for="address">Shipping Address :</label>
            <textarea name="address" id="address" rows="5"  cols="30"></textarea><br>
  
            <label for="pincode">PIN Code :</label>
            <input type="text" name="pincode" id="pincode" pattern="[0-9]{6}" required placeholder="Enter 6 digit PIN code"><br>

            <label for="creditCard">Credit Card No :</label>
            <input type="text" name="creditCard" id="creditCard" pattern="[0-9]{16}" required placeholder="Enter 16 digit Credit Card No"><br>

            <label for="expDate">Expiry Date :</label>
            <input type="month" name="expDate" id="expDate" required><br>

            <label for="cvv">CVV :</label>
            <input type="password" name="cvv" id="cvv" pattern="[0-9]{3}" required placeholder="Enter 3 digit CVV" ><br>

            <button type="submit">Checkout</button>
            <button type="reset">Reset</button>
        </div>
    </form>

</body>
</html>
