<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Booking</title>
    <style>
        h1, h2 {
            text-align: center;
        }

        .tab {
            display: none;
        }
        
        .step {
            height: 15px;
            width: 15px;
            margin: 0 2px;
            background-color: #bbbbbb;
            border: none;  
            border-radius: 50%;
            display: inline-block;
            opacity: 0.5;
        }

        .step.active {
            opacity: 1;
        }
        .step.finish {
            background-color: #04AA6D;
        }
        #prevBtn {
            background-color: #bbbbbb;
        }
    </style>
</head>
<body>
    <h1>Travel Booking</h1>
    <form id="travelBooking">
        
        <div class="tab">
            <h2>Traveler Info:</h2>
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" required><br>

            <label for="email">Email:</label>
            <input type="email" name="email" id="email" required><br>

            <label for="phone">Phone:</label>
            <input type="tel" name="phone" id="phone" required><br>
        </div>

        <div class="tab">
            <h2>Trip Details:</h2>
            <label for="destination">Destination:</label>
            <input type="text" name="destination" id="destination" list="destination-list" placeholder="Search for destination..." required>
            <datalist id="destination-list">
                <option value="Leh, Ladakh"></option>
                <option value="Taj Mahal, Agra"></option>
                <option value="Marina Beach, Chennai"></option>
                <option value="Shore Temple, Pondicherry"></option>
                <option value="Hampi, Karnataka"></option>
                <option value="Mysore Palace"></option>
                <option value="Cliff Beach, Kerala"></option>
                <option value="Gokarna, Karnataka"></option>
                <option value="Jog Falls, Karnataka"></option>
            </datalist><br>

            <label for="startdate">Start Date:</label>
            <input type="date" name="startdate" id="startdate" required><br>

            <label for="enddate">End Date:</label>
            <input type="date" name="enddate" id="enddate" required><br>
        </div>

        <div class="tab">
            <h2>Payment:</h2>
            <label for="cardno">Card No:</label>
            <input type="text" name="cardno" id="cardno" pattern="[0-9]{16}" placeholder="16-digit card number" required><br>

            <label for="cvv">CVV:</label>
            <input type="password" name="cvv" id="cvv" pattern="[0-9]{3}" placeholder="3-digit CVV" required><br>

            <input type="checkbox" name="agree" id="agree" style="width: auto;" required>
            <label for="agree" style="display: inline;">I agree to the terms and conditions.</label>
            
        </div>

        <div style="overflow:auto; margin-top: 20px;">
            <div style="float:right;">
                <button type="button" id="prevBtn" onclick="nextPrev(-1)">Previous</button>
                <button type="button" id="nextBtn" onclick="nextPrev(1)">Next</button>
            </div>
        </div>

        <div style="text-align:center;margin-top:40px;">
            <span class="step"></span>
            <span class="step"></span>
            <span class="step"></span>
        </div>

    </form>

    <!-- Reference: https://www.w3schools.com/howto/howto_js_steps.asp -->
    <script>
        var currentTab = 0; // Current tab is set to be the first tab (0)
        showTab(currentTab); // Display the current tab

        function showTab(n) {
            var x = document.getElementsByClassName("tab");
            
            // FIX: Hide all tabs first
            for (let i = 0; i < x.length; i++) {
                x[i].style.display = "none";
            }
            
            // Show the current tab
            x[n].style.display = "block";

            // Update Previous/Next buttons
            document.getElementById("prevBtn").style.display = (n == 0) ? "none" : "inline";
            
            if (n == (x.length - 1)) {
                document.getElementById("nextBtn").innerHTML = "Submit";
            } else {
                document.getElementById("nextBtn").innerHTML = "Next";
            }
            
            fixStepIndicator(n);
        }

        function nextPrev(n) {
            var x = document.getElementsByClassName("tab");
            
            // Don't proceed to next tab if validation fails
            if (n == 1 && !validateForm()) return false;

            // Hide the current tab
            x[currentTab].style.display = "none";
            
            // Increase or decrease the current tab by 1
            currentTab = currentTab + n;
            
            // If you have reached the end of the form...
            if (currentTab >= x.length) {
                // ... the form gets submitted
                // FIX: Use the correct form ID and submit
                document.getElementById("travelBooking").submit();
                alert("Form Submitted Successfully!"); 
                return false;
            }
            
            // Otherwise, display the correct tab
            showTab(currentTab);
        }

        function validateForm() {
            var x, y, i, valid = true;
            x = document.getElementsByClassName("tab");
            y = x[currentTab].getElementsByTagName("input");

            // A loop that checks every input field in the current tab
            for (i = 0; i < y.length; i++) {
                // FIX: Use the powerful checkValidity() method
                // It checks for 'required', 'pattern', 'type', etc. automatically
                if (!y[i].checkValidity()) {
                    y[i].className += " invalid"; // Add an "invalid" class
                    valid = false;
                } else {
                    // NEW: Remove the invalid class if the field is now valid
                    y[i].className = y[i].className.replace(" invalid", "");
                }
            }

            if (valid) {
                document.getElementsByClassName("step")[currentTab].className += " finish";
            }
            return valid; // return the valid status
        }

        function fixStepIndicator(n) {
            var i, x = document.getElementsByClassName("step");
            for (i = 0; i < x.length; i++) {
                x[i].className = x[i].className.replace(" active", "");
            }
            x[n].className += " active";
        }
    </script>

</body>
</html>
